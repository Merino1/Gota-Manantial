<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gota Manantial</title></head>
<body style="font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#eef;">
<form method="POST" style="background:white; padding:20px; border-radius:10px; box-shadow:0 2px 10px #0003;">
<h2>Login Manantial</h2>
<input name="username" placeholder="Usuario" required style="width:100%; padding:10px; margin:5px 0;"><br>
<input name="password" type="password" placeholder="Contraseña" required style="width:100%; padding:10px; margin:5px 0;"><br>
<button style="width:100%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px;">Entrar</button>
</form>
</body>
</html>
